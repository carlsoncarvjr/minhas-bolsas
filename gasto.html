<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gasto da IA</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
  <style>
    .pagina { padding-top: 8px; padding-bottom: 40px; }
    .hero { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); padding: 18px; }
    .hero .rot { font-size: 14px; color: var(--suave); font-weight: 700; }
    .hero .val { font-size: 40px; font-weight: 800; letter-spacing: -.02em; margin: 2px 0; }
    .hero .det { font-size: 14px; color: var(--suave); }
    .medidor { height: 10px; border-radius: 99px; background: var(--linha); overflow: hidden; margin: 14px 0 6px; }
    .medidor i { display: block; height: 100%; border-radius: 99px; background: var(--marca); }
    .medidor.alto i { background: var(--ambar); }
    .medidor.cheio i { background: var(--vermelho); }
    .barras { display: flex; align-items: flex-end; gap: 2px; height: 140px; padding: 0 2px; border-bottom: 1px solid var(--linha); position: relative; }
    .barras .b { flex: 1; min-width: 0; height: 100%; display: flex; align-items: flex-end; cursor: default; }
    .barras .b i { display: block; flex: 1 1 auto; background: var(--marca); border-radius: 4px 4px 0 0; min-height: 0; }
    .barras .b:hover i, .barras .b:focus i { background: #6d2a46; }
    .barras .b.sem i { background: transparent; }
    .eixo { display: flex; justify-content: space-between; font-size: 12px; color: var(--suave); margin-top: 6px; }
    #dica { position: fixed; pointer-events: none; background: var(--tinta); color: #fff; font-size: 13px; font-weight: 700; padding: 6px 10px; border-radius: 8px; opacity: 0; transition: opacity .1s; z-index: 20; white-space: nowrap; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linha); }
    th { font-size: 13px; color: var(--suave); font-weight: 700; }
    td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    tr:last-child td { border-bottom: 0; }
    .cambio { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--suave); margin-top: 18px; }
    .cambio input { width: 80px; border: 1px solid var(--linha); border-radius: 8px; padding: 6px 8px; font: inherit; }
  </style>
</head>
<body>
  <header class="topo"><h1>Gasto da IA</h1><span class="sub" id="modelo"></span></header>
  <main class="pagina" id="app"><div class="carregando">Carregando…</div></main>
  <div id="dica" role="tooltip"></div>
  <script type="module">
    import { SERVIDOR_URL } from './assets/config.js';
    const $ = (s) => document.querySelector(s);
    const app = $('#app');
    const ler = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
    const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

    const daUrl = new URLSearchParams(location.search).get('c');
    if (daUrl) gravar('gasto-codigo', daUrl);
    const codigo = daUrl || ler('gasto-codigo') || '';
    let cambio = Number(ler('gasto-cambio')) || 5.6;

    const brl = (usd) => (usd * cambio).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const usd = (v) => 'US$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const nomeMes = (m) => { const [y, mm] = m.split('-').map(Number); const t = new Date(y, mm - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };

    if (!SERVIDOR_URL || !codigo) {
      app.innerHTML = '<div class="cartao vazio">Abra esta página pelo link do gasto (com o código no final).</div>';
    } else {
      fetch(SERVIDOR_URL.replace(/\/+$/, '') + '/gasto', { headers: { 'X-Codigo': codigo } })
        .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || 'Erro ' + r.status); return d; })
        .then(mostrar)
        .catch((e) => { app.innerHTML = `<div class="cartao vazio">Não consegui carregar o gasto.<br><small>${e.message}</small></div>`; });
    }

    function mostrar(d) {
      $('#modelo').textContent = d.modelo;
      const mes = d.hoje.slice(0, 7);
      const dias = d.dias || {};
      const doMes = Object.entries(dias).filter(([k]) => k.startsWith(mes));
      const soma = (lista, c) => lista.reduce((s, [, x]) => s + (x[c] || 0), 0);
      const total = soma(doMes, 'usd');
      const falas = soma(doMes, 'voz');
      const paginas = soma(doMes, 'caderno');
      const usos = falas + paginas;
      const pct = Math.min(100, (total / d.limiteMesUsd) * 100);

      // um ponto por dia do mês, até hoje
      const ultimo = Number(d.hoje.slice(8, 10));
      const serie = Array.from({ length: ultimo }, (_, i) => {
        const k = `${mes}-${String(i + 1).padStart(2, '0')}`;
        return { dia: i + 1, k, x: dias[k] || {} };
      });
      const max = Math.max(...serie.map((s) => s.x.usd || 0), 0.0001);

      // meses anteriores
      const meses = {};
      for (const [k, x] of Object.entries(dias)) {
        const m = k.slice(0, 7);
        meses[m] = meses[m] || { usd: 0, voz: 0, caderno: 0 };
        meses[m].usd += x.usd || 0; meses[m].voz += x.voz || 0; meses[m].caderno += x.caderno || 0;
      }
      const linhasMes = Object.entries(meses).sort((a, b) => b[0].localeCompare(a[0]));

      app.innerHTML = `
        <div class="hero">
          <div class="rot">${nomeMes(mes)}</div>
          <div class="val">${brl(total)}</div>
          <div class="det">${usd(total)} de ${usd(d.limiteMesUsd)} de limite</div>
          <div class="medidor ${pct >= 100 ? 'cheio' : pct >= 75 ? 'alto' : ''}" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}" aria-label="Uso do limite do mês"><i style="width:${pct}%"></i></div>
          <div class="det">${pct >= 100 ? 'Limite atingido: a IA está parada até o mês virar.' : `${Math.round(pct)}% do limite usado`}</div>
        </div>
        <div class="numeros" style="margin-top:12px">
          <div class="numero"><div class="rot">Frases faladas</div><div class="val">${falas}</div></div>
          <div class="numero"><div class="rot">Páginas do caderno</div><div class="val">${paginas}</div></div>
          <div class="numero"><div class="rot">Custo médio</div><div class="val">${usos ? brl(total / usos) : '—'}</div><div class="det">por uso</div></div>
          <div class="numero"><div class="rot">Hoje</div><div class="val">${brl(dias[d.hoje]?.usd || 0)}</div></div>
        </div>
        <div class="secao"><h2>Gasto por dia</h2></div>
        <div class="cartao">
          <div class="barras" id="barras">${serie.map((s) => `<div class="b ${s.x.usd ? '' : 'sem'}" tabindex="0" data-dica="Dia ${s.dia}: ${brl(s.x.usd || 0)} · ${s.x.voz || 0} falas, ${s.x.caderno || 0} páginas"><i style="height:${((s.x.usd || 0) / max) * 100}%"></i></div>`).join('')}</div>
          <div class="eixo"><span>dia 1</span><span>maior dia: ${brl(max === 0.0001 ? 0 : max)}</span><span>dia ${ultimo}</span></div>
        </div>
        <div class="secao"><h2>Por mês</h2></div>
        <div class="lista">${linhasMes.length ? `<table>
          <thead><tr><th>Mês</th><th class="n">Falas</th><th class="n">Páginas</th><th class="n">Gasto</th></tr></thead>
          <tbody>${linhasMes.map(([m, x]) => `<tr><td>${nomeMes(m)}</td><td class="n">${x.voz}</td><td class="n">${x.caderno}</td><td class="n"><b>${brl(x.usd)}</b></td></tr>`).join('')}</tbody>
        </table>` : '<div class="vazio">Nenhum uso ainda.</div>'}</div>
        <label class="cambio">Dólar a R$ <input id="cambio" inputmode="decimal" value="${String(cambio).replace('.', ',')}"> <span>(só para a conta em reais)</span></label>`;

      const dica = $('#dica');
      const barras = $('#barras');
      const mostra = (el, x, y) => { dica.textContent = el.dataset.dica; dica.style.left = Math.min(x + 12, innerWidth - dica.offsetWidth - 8) + 'px'; dica.style.top = (y - 40) + 'px'; dica.style.opacity = 1; };
      barras.addEventListener('pointermove', (e) => { const el = e.target.closest('.b'); if (el) mostra(el, e.clientX, e.clientY); });
      barras.addEventListener('pointerleave', () => (dica.style.opacity = 0));
      barras.addEventListener('focusin', (e) => { const r = e.target.getBoundingClientRect(); mostra(e.target, r.left, r.top); });
      barras.addEventListener('focusout', () => (dica.style.opacity = 0));
      $('#cambio').addEventListener('change', (e) => {
        const v = Number(String(e.target.value).replace(',', '.'));
        if (v > 0) { cambio = v; gravar('gasto-cambio', String(v)); mostrar(d); }
      });
    }
  </script>
</body>
</html>
