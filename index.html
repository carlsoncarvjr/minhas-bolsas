<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luana Closet</title>
  <meta name="theme-color" content="#FAF7F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Luana Closet">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <div id="app">
    <div class="carregando">Carregando…</div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="desfazer" role="status" aria-live="polite"></div>
  <dialog id="folha"><div id="folha-conteudo"></div></dialog>
  <script>
    // Aberto com dois cliques (file://) o navegador bloqueia os scripts: explica o que fazer.
    if (location.protocol === 'file:') document.getElementById('app').innerHTML =
      '<div class="carregando" style="padding-top:30vh;max-width:420px;margin:0 auto">Este portal precisa abrir por um endereço (http), não com dois cliques no arquivo.<br><br>No Terminal, dentro da pasta Bolsas: <b>python3 -m http.server 8020</b><br>e depois abra <b>http://localhost:8020</b></div>';
  </script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
